<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>e-SIKAP · SMA Negeri 1 Gambiran</title>
  <meta name="description" content="e-SIKAP: website Program Sekolah Inovatif Ketahanan Pangan SMA Negeri 1 Gambiran. Tahapan program, laporan piket kebun setiap kelas, dan bukti kegiatan, terintegrasi dengan pembelajaran.">
  <meta name="theme-color" content="#4a7c3a">
  <meta property="og:type" content="website">
  <meta property="og:title" content="e-SIKAP · SMA Negeri 1 Gambiran">
  <meta property="og:description" content="Tahapan Program SIKAP, laporan piket kebun setiap kelas, dan bukti kegiatan SMA Negeri 1 Gambiran.">
  <meta property="og:image" content="https://www.sman1gambiran.sch.id/upload/picture/18776856Untitled(500x500px)(1).png">
  <link rel="icon" href="https://www.sman1gambiran.sch.id/upload/imagecache/57564828B7jVx6dCEAEYxI4-removebg-preview-76x100.png">
  <style>
    html, body { margin: 0; height: 100%; background: #fbfcf8; overflow: hidden; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
    #load { position: fixed; inset: 0; display: grid; place-items: center; background: #fbfcf8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #2f5d27; transition: opacity .4s; z-index: 2; }
    #load.hide { opacity: 0; pointer-events: none; }
    .box { text-align: center; padding: 24px; }
    .box img { height: 84px; }
    .spin { width: 42px; height: 42px; border-radius: 50%; border: 4px solid #dfe7d4; border-top-color: #4a7c3a; margin: 18px auto 12px; animation: s 1s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    .box b { display: block; font-size: 18px; }
    .box small { color: #5b6655; }
    #slow { display: none; margin-top: 16px; font-size: 14px; color: #5b6655; }
    #slow a { color: #fff; background: #4a7c3a; padding: 9px 18px; border-radius: 999px; text-decoration: none; font-weight: 600; display: inline-block; margin-top: 8px; }
    @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  </style>
</head>
<body>
  <div id="load" role="status">
    <div class="box">
      <img src="https://www.sman1gambiran.sch.id/upload/imagecache/57564828B7jVx6dCEAEYxI4-removebg-preview-76x100.png" alt="Logo SMA Negeri 1 Gambiran" onerror="this.remove()">
      <div class="spin"></div>
      <b>e-SIKAP</b>
      <small>SMA Negeri 1 Gambiran · memuat...</small>
      <div id="slow">Portal lama terbuka?<br><a id="direct" href="#" target="_top">Buka portal langsung</a></div>
    </div>
  </div>

  <iframe id="app" title="e-SIKAP SMA Negeri 1 Gambiran"
    allow="fullscreen; autoplay; clipboard-read; clipboard-write; camera; microphone; geolocation; encrypted-media; picture-in-picture; web-share"
    allowfullscreen></iframe>

  <script>
    // Alamat Web App Apps Script (deployment /exec). Ganti di sini bila deployment-nya berganti.
    var PORTAL_URL = "https://script.google.com/macros/s/AKfycbzp25V361vraL8m9SByloqNcfiMF6Ae7dBW1vK-GcjS38OAbD9H0wz6H71Nx6LiwcCs/exec";

    var frame = document.getElementById("app");
    var load = document.getElementById("load");
    document.getElementById("direct").href = PORTAL_URL;
    frame.onload = function () { load.classList.add("hide"); };
    setTimeout(function () { document.getElementById("slow").style.display = "block"; }, 12000);
    frame.src = PORTAL_URL;
  </script>
</body>
</html>
